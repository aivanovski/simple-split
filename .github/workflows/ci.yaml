name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-kotlin-code-format:
    name: Check Kotlin code format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run ktlint
        working-directory: android
        run: ./gradlew ktlintCheck

  check-scala-code-format:
    name: Check Scala code format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache Dependencies
        uses: coursier/cache-action@v6

      - name: Run scalafmt check
        working-directory: backend
        run: sbt scalafmtCheckAll

  verify-openapi-schema:
    name: Verify OpenAPI schema
    needs: [check-scala-code-format]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache dependencies
        uses: coursier/cache-action@v6

      - name: Generate OpenAPI schema
        working-directory: backend
        run: sbt generateOpenApi

      - name: Check OpenAPI schema is up to date
        run: git diff --exit-code -- backend/openapi-schema/openapi.yaml

      - name: Test OpenAPI schema
        working-directory: backend
        run: sbt openapiSchema/test

  build-android-app:
    name: Build Android app
    needs: [check-kotlin-code-format, verify-openapi-schema]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build debug apk
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Store APK file
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-backend-app:
    name: Build Backend app
    needs: [check-scala-code-format, verify-openapi-schema]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache dependencies
        uses: coursier/cache-action@v6

      - name: Run sbt compile
        working-directory: backend
        run: sbt app/compile

      - name: Run tests
        working-directory: backend
        run: sbt test

      - name: Build jar file
        working-directory: backend
        run: sbt app/assembly

      - name: Store jar file
        uses: actions/upload-artifact@v4
        with:
          name: simple-split-backend.jar
          path: backend/app/target/scala-3.7.1/simple-split-backend.jar
